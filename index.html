<style>
:root{--ro:#FAEADD;--ch:#222023;--pu:#522A6F;--rs:#F29CB7;--so:#FBCF4F;--li:#DDAAFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff;color:var(--ch);line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,textarea{font:inherit}
.w{max-width:1180px;margin:auto;padding:0 20px 60px}
nav{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px;flex-wrap:wrap}
nav img{height:54px;width:auto;display:block}nav .t{display:flex;gap:4px;flex-wrap:wrap}
.tb{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px}.tb.on{background:var(--ro);color:var(--pu)}
.btn{border-radius:99px;padding:12px 24px;font-weight:600;background:var(--ch);color:#fff}.btn.o{background:#fff;color:var(--ch);border:1.5px solid #ddd}.btn.p{background:var(--pu)}.btn.wh{background:#fff;color:var(--ch)}.btn:disabled{opacity:.4}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:6px}
.hl{border-radius:28px;padding:48px 40px;color:#fff;background:radial-gradient(90% 55% at 95% 105%,rgba(251,207,79,.75),transparent 65%),radial-gradient(110% 70% at 70% 110%,rgba(242,156,183,.8),transparent 65%),linear-gradient(165deg,#222023 0%,#3a2352 35%,#522A6F 75%)}
h1{font-size:clamp(32px,4.6vw,54px);line-height:1.08;letter-spacing:-.03em;font-weight:800}.hl p{margin:16px 0 28px;opacity:.85;max-width:460px}.hl h4{margin-bottom:12px}
#hc{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.ct{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(221,170,255,.28);font-weight:600;font-size:14px;text-align:left;max-width:240px;transition:.2s}.ct svg{width:20px;flex:none}.ct.on{background:#fff;color:var(--pu)}
.hr{position:relative;border-radius:28px;background:linear-gradient(180deg,var(--li),var(--ro));overflow:hidden;min-height:520px}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}.ph img{width:100%;height:100%;object-fit:cover}.ph svg{width:62%;fill:#fff;opacity:.55}
.fl{position:absolute;top:22px;left:22px;max-width:270px;background:#fff;border-radius:16px;padding:14px 16px;font-size:13px;box-shadow:0 8px 30px rgba(34,32,35,.15)}.fl b{display:block;color:var(--pu);margin-bottom:2px}
.qt{position:absolute;left:22px;right:22px;bottom:44px;background:#fff;border-radius:16px;padding:14px 18px;font-weight:600;font-size:14px}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:8px;height:8px;border-radius:9px;background:#fff;opacity:.7;cursor:pointer}.dots i.on{width:22px;background:var(--pu);opacity:1}
section h2,.pg h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em;font-weight:800}
.cat{display:flex;gap:8px;margin:16px 0 22px;flex-wrap:wrap}.cat button{padding:8px 16px;border-radius:99px;border:1.5px solid #e4dfe8;font-weight:600;font-size:14px}.cat .on{background:var(--pu);color:#fff;border-color:var(--pu)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cc{background:#FBF3EC;border-radius:22px;padding:22px;display:flex;flex-direction:column}
.mk{height:120px;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.ic{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--pu);display:grid;place-items:center;box-shadow:0 4px 14px rgba(82,42,111,.1)}.ic svg{width:24px;height:24px}
.bars{display:flex;flex-direction:column;gap:7px;background:#fff;padding:12px;border-radius:12px;width:90px}.bars i{height:6px;border-radius:5px;background:var(--pu);opacity:.8}.bars i+i{opacity:.3}
.cc h3{font-size:18px;margin-bottom:4px}.cc p{font-size:14px;color:#555;flex:1}.cc small{color:var(--pu);font-weight:600}.lk{margin-top:14px;font-weight:700;text-align:left;font-size:14px}
.mo{position:fixed;inset:0;background:rgba(34,32,35,.55);display:grid;place-items:center;z-index:9;padding:16px}
.bx{background:#fff;border-radius:24px;padding:32px;width:100%;max-width:400px}.bx h3{font-size:24px;margin-bottom:4px}.bx input{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:12px;margin:6px 0 12px}.bx .btn{width:100%}
.pg{padding-top:18px}.pg>p{color:#666;margin:4px 0 20px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:30px}
.fc{border-radius:22px;padding:24px;text-align:left;background:var(--ro);transition:.2s}.fc:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(82,42,111,.15)}.fc .ic{margin-bottom:14px}.fc h3{margin-bottom:4px}.fc p{font-size:14px;color:#555}
.card{background:#fff;border:1.5px solid #eee;border-radius:22px;padding:22px;margin-bottom:14px}
.chd{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:12px}.gv{width:34px;height:34px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;flex:none}.gv svg{width:18px}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 0}
.bb{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;background:var(--ro)}.bb.me{align-self:flex-end;background:var(--pu);color:#fff}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.qk button,.chip{padding:7px 14px;border-radius:99px;background:#fff;border:1.5px solid #e4dfe8;font-size:13px;font-weight:600}.chip.sel,.ct2.sel{background:var(--pu);color:#fff;border-color:var(--pu)}
.row{display:flex;gap:8px}.row input,.row textarea,textarea.ta{flex:1;padding:12px 14px;border:1.5px solid #ddd;border-radius:14px;width:100%}
.rp{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.sc dt{font-size:12px;font-weight:700;color:var(--pu);text-transform:uppercase;margin-top:12px}.sc dd{margin:2px 0 0;font-size:14px}
.bar{display:flex;gap:6px;margin-bottom:20px}.bar i{flex:1;height:6px;border-radius:5px;background:#eee}.bar i.on{background:var(--pu)}
.gc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}.ct2{padding:14px;border-radius:14px;border:1.5px solid #e4dfe8;font-weight:600;text-align:left}
.mc{display:flex;gap:14px;border:1.5px solid #e4dfe8;border-radius:18px;padding:16px;margin-bottom:10px;text-align:left;width:100%}.mc.sel{border-color:var(--pu);background:#faf5fd}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--rs),var(--li));display:grid;place-items:center;font-weight:800;color:var(--pu);flex:none}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.em{background:var(--ro);border-radius:14px;padding:14px;font-size:13px;margin-top:10px}
.rm{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.vid{position:relative;border-radius:24px;min-height:460px;background:linear-gradient(160deg,#222023,#522A6F 70%,#b86f93);display:grid;place-items:center;color:#fff}
.vid .av{width:110px;height:110px;font-size:36px}.vid .nm{display:block;text-align:center;margin-top:10px;font-weight:600}
.me2{position:absolute;right:16px;top:16px;width:130px;height:90px;border-radius:14px;background:var(--li);color:var(--pu);display:grid;place-items:center;font-weight:700;font-size:13px}
.ctl{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:10px}.ctl button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center}.ctl svg{width:22px}.ctl .x{background:#fff;color:var(--ch);opacity:.6}.ctl .end{width:auto;padding:0 20px;border-radius:99px;background:#e5484d}
.tm{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-size:13px}

function land(){return `<div class="w"><nav>${logo()}<button class="btn o" onclick="L(1)">Masuk</button></nav>
<section class="hero"><div class="hl"><h1>Lakukan gladi resik sebelum hari-H karier!</h1><p>Latihan ngobrol sama client, curhat karier ke Gavi, dan ngobrol langsung sama orang yang sudah lolos di perusahaan inceranmu. Biar hari-H nggak kaget.</p><div id="hc">${hc()}</div><button class="btn wh" onclick="L(1)">Mulai gladi</button></div><div class="hr" id="rot">${rot()}</div></section>
<section style="margin-top:56px"><h2>Spesialis yang dicari di perusahaan impianmu</h2><p style="color:#666;margin:6px 0 22px">Pilih jalurmu. Latihannya disusun dari kebutuhan nyata di perusahaan.</p><div class="pl">${CO.map(c=>`<div class="pc" style="--c:${c.c}"><h3>${c.t}</h3><p>${c.d}</p><small style="color:#666">Dicari di</small><b style="font-size:14px">${c.at}</b><h4>Yang kamu latih</h4><ul>${c.w.map(w=>`<li>${w}</li>`).join('')}</ul><button class="btn" onclick="L(1)">Book a demo</button></div>`).join('')}</div></section><footer>© 2026 Gladi</footer></div>`}
const LG={t:'Syarat & Ketentuan (ringkas): Gladi menyediakan latihan dan pendampingan karier, tanpa menjamin kamu diterima kerja. Kamu bertanggung jawab atas kebenaran data yang kamu isi. Langganan berlaku 30 hari dan pengembalian dana mengikuti ketentuan yang tertera saat pembayaran. Mentor bukan perwakilan resmi perusahaan.',p:'Kebijakan Privasi (ringkas): sesuai UU Pelindungan Data Pribadi (UU No. 27 Tahun 2022), datamu (CV, rekaman latihan, hasil analisis) hanya dipakai untuk layanan Gladi. Ringkasan hasil simulasi hanya dibagikan ke mentor yang kamu pilih. Kamu bisa meminta akses, koreksi, atau penghapusan datamu kapan saja.'};
function lg(k){const e=$('#lgt');e.textContent=LG[k];e.style.display='block'}
function L(o){$('#mdl').innerHTML=o?`<div class="mo" onclick="if(event.target==this)L(0)"><div class="bx"><h3>Masuk / Daftar</h3><p style="color:#666;margin-bottom:16px;font-size:14px">Cukup isi nama dan email.</p><label>Nama</label><input id="nama" placeholder="Nama kamu"><label>Email</label><input id="em" type="email" placeholder="kamu@email.com"><label class="cs"><input type="checkbox" onchange="$('#lb').disabled=!this.checked"><span>Saya menyetujui <a href="#" onclick="lg('t');return false">Syarat & Ketentuan</a> serta <a href="#" onclick="lg('p');return false">Kebijakan Privasi</a> yang berlaku.</span></label><div id="lgt" class="em" style="display:none;margin:0 0 12px"></div><button class="btn p" id="lb" disabled onclick="login()">Masuk / Daftar</button></div></div>`:''}
function login(){S.name=$('#nama').value.trim();S.u=$('#em').value.trim()||'teman@gladi.id';L(0);go('home')}
function pay(k){const p=PL[k],t=p.p*(S.ref?.9:1);$('#mdl').innerHTML=`<div class="mo" onclick="if(event.target==this)L(0)"><div class="bx"><h3>${p.n}</h3><p style="font-size:14px;color:#555;margin:4px 0 14px">Total ${rupiah(t)}${S.ref?' (diskon referral 10%)':''} • aktif 30 hari</p><label class="cs"><input type="checkbox" onchange="$('#pb').disabled=!this.checked"><span>Saya menyetujui Syarat & Ketentuan pembayaran, kebijakan pengembalian dana, dan pemrosesan data pribadi untuk transaksi ini sesuai Kebijakan Privasi.</span></label><button class="btn p" id="pb" disabled onclick="S.plan='${k}';L(0);render()">Bayar ${rupiah(t)}</button><p style="font-size:12px;color:#888;margin-top:8px">Simulasi, belum ada pembayaran sungguhan.</p></div></div>`}
function go(v){S.v=v;if(v=='rr')S.rrv=1;if(v=='mt'&&S.m.s==4)S.m=newM();S.err='';render();scrollTo(0,0)}
function head(){return `<nav>${logo()}<div class="t">${[['home','Home'],['kon','Konsul Gavi'],['rp','Role Play'],['mt','Mentoring'],['rr','Report']].map(t=>`<button class="tb ${S.v==t[0]||(S.v=='room'&&t[0]=='home')?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div><button class="btn o" onclick="S.u=null;S.v='land';render()">Keluar</button></nav>`}
function lock(f){const rp=f=='rp';return `<div class="pg"><h2>${rp?'Gavi Role Play':'Mentoring Alumni'}</h2><div class="card"><b>${S.plan=='free'?'Fitur ini butuh paket berbayar.':'Sesi di paketmu sudah habis.'}</b><p style="color:#555;margin:6px 0 14px">${rp?'AI Role Play: 3 sesi di Gladi Basic, tanpa batas di Gladi Intensif.':'Mentoring 1-on-1: 4 sesi di Gladi Plus, 7 sesi di Gladi Intensif.'}</p><button class="btn p" onclick="go('home');setTimeout(()=>$('#lgn').scrollIntoView(),50)">Lihat langganan</button></div></div>`}
function sub(){const pr=[['free','#e4dfe8',['AI Konsul versi dasar: 5 pesan chat + peta kesenjangan','Rencana 30 hari: 3 langkah awal','Role Play, Mentoring, Readiness Report: terkunci']],['basic','#DDAAFF',['AI Konsul lengkap, tanpa limit','AI Role Play: 3 sesi','Recognition (analisis nonverbal)','Readiness Report (30 hari)']],['plus','#F29CB7',['Semua isi Gladi Basic','Career framework','Mentoring 1-on-1: 4 sesi','Aktif 30 hari']],['int','#FBCF4F',['AI Role Play tanpa batas','Mentoring 1-on-1: 7 sesi','Continuous feedback dari mentor di luar sesi','Readiness Report akhir (30 hari)']]];
return `<h2 id="lgn" style="font-size:24px;margin:34px 0 12px">Langganan</h2><div class="pl">${pr.map(x=>{const p=PL[x[0]],t=p.p*(S.ref?.9:1);return `<div class="pc" style="--c:${x[1]}"><h3>${p.n}</h3><div class="pr">${p.p?(S.ref?`<s style="font-size:15px;color:#999">${rupiah(p.p)}</s> `:'')+rupiah(t):'Rp0'}</div><small style="color:#666">${p.p?'per 30 hari':'selamanya'}</small><h4>Termasuk</h4><ul>${x[2].map(w=>`<li>${w}</li>`).join('')}</ul>${S.plan==x[0]?'<button class="btn o" disabled>Paket aktif</button>':p.p?`<button class="btn" onclick="pay('${x[0]}')">Pilih paket</button>`:''}</div>`}).join('')}</div>`}
function refc(){const c='GLADI-'+nm().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);return `<h2 style="font-size:24px;margin:34px 0 12px">Referral</h2><div class="g3"><div class="card"><b>Ajak temanmu, kasih diskon 10%</b><p style="font-size:14px;color:#555;margin:4px 0 12px">Teman yang memakai kodemu dapat diskon 10% di ketiga paket.</p><div class="row"><input class="in" style="margin:0" readonly value="${c}"><button class="btn o" onclick="try{navigator.clipboard.writeText('${c}')}catch(e){};this.textContent='Tersalin'">Salin</button></div></div><div class="card"><b>Punya kode referral?</b><div class="row" style="margin-top:12px"><input class="in" style="margin:0" id="rf" placeholder="GLADI-XXXX"><button class="btn p" onclick="ar()">Pakai</button></div><p id="rm" style="font-size:13px;margin-top:8px;color:var(--pu)">${S.ref?'Diskon 10% aktif untuk semua paket.':''}</p></div></div>`}
function ar(){const v=$('#rf').value.trim().toUpperCase();if(/^GLADI-[A-Z0-9]{3,}$/.test(v)){S.ref=1;render()}else $('#rm').textContent='Kode tidak valid.'}
let SM;
const API_URL='';/* isi dengan URL Cloudflare Worker kamu */
async function AI(p,j){if(SM===undefined){try{SM=await claude.use('sample')}catch(e){SM=null}}if(SM){if(j){const v=await SM.json(p,{cache:false});return typeof v=='string'?JSON.parse(v):v}return (await SM(p,{cache:false})).text}if(!API_URL)throw 0;const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});if(!r.ok)throw 0;const t=(await r.json()).text||'';if(!j)return t;return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}
const PF=()=>{const p=S.prof;return p.saved?`Perusahaan target: ${p.co}. Posisi target: ${p.pos}. CV/ringkasan: ${p.cv||'-'}. Portofolio: ${p.pf||'-'}.`:'Profil target belum diisi.'};
const rep=()=>'Terima kasih sudah cerita. Apa yang paling bikin kamu ragu soal ini, dan kapan kamu perlu memutuskan?';
function pfm(){const p=S.prof;if(p.saved)return `<div class="card" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><small style="color:var(--pu);font-weight:800">PROFIL TARGET</small><div><b>${E(p.pos)}</b> di <b>${E(p.co)}</b></div><div style="font-size:13px;color:#666">CV: ${E(p.cvf||(p.cv?'teks ditempel':'belum ada'))}${p.pf?' • Portofolio: '+E(p.pf):''}</div></div><button class="btn o" onclick="S.prof.saved=0;render()">Ubah</button></div>`;
return `<div class="card"><h3 style="margin-bottom:4px">Mulai dari profil targetmu</h3><p style="font-size:14px;color:#555;margin-bottom:10px">Pilih perusahaan dan posisi incaranmu, lalu unggah CV (portofolio opsional). Dipakai hanya untuk analisis Gavi.</p><div class="g3" style="margin:0"><div><label>Perusahaan target</label><select class="in" id="pco"><option value="">Pilih perusahaan</option>${COM.map(c=>`<option ${p.co==c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Posisi target</label><input class="in" id="ppo" value="${E(p.pos)}" placeholder="contoh: Product Manager"></div></div><label>Unggah CV</label><input class="in" type="file" id="pcf" accept=".pdf,.doc,.docx,.txt" onchange="S.prof.cvf=this.files[0]?this.files[0].name:''"><label>Tempel isi CV supaya Gavi bisa membacanya (demo)</label><textarea class="ta in" id="pcv" rows="4">${E(p.cv)}</textarea><label>Portofolio (opsional)</label><input class="in" id="ppf" value="${E(p.pf)}" placeholder="link portofolio"><p style="color:#c0392b;font-size:13px">${S.err}</p><button class="btn p" onclick="sp()">Simpan profil</button></div>`}
function sp(){const g=i=>$(i).value.trim(),p=S.prof;p.co=g('#pco');p.pos=g('#ppo');p.cv=g('#pcv');p.pf=g('#ppf');if(!p.co||!p.pos){S.err='Pilih perusahaan dan isi posisi target dulu ya';render();return}S.err='';p.saved=1;render()}
const stp=()=>{const a=[['Profil target',S.prof.saved,'home'],['Peta kesenjangan',!!S.gap,'kon'],['Role Play',S.ru>0,'rp'],['Jadwal mentor',S.bk.length>0,'mt'],['Sesi mentoring',!!S.att,'mt'],['Readiness Report',!!S.rrv,'rr']];return `<div class="stp">${a.map((x,i)=>`<button class="${x[1]?'ok':''}" onclick="go('${x[2]}')"><i>${x[1]?'✓':i+1}</i>${x[0]}</button>`).join('')}</div>`};
function home(){const f=[['kon','chat','Gavi Konsul','Konsul apa saja seputar kerjaan dan karier, atau cek kesenjangan profilmu terhadap posisi target lalu dapat rencana 30 hari.','Gratis: versi dasar'],['rp','mic','Gavi Role Play','Ceritakan masalahmu, Gavi memerankan lawan bicara yang relevan sesuai gaya perusahaan tujuan. Umpan balik: isi jawaban, gaya bicara, nonverbal.','Terbatas: 3 sesi di Basic'],['mt','users','Mentoring Alumni','Sesi 60 menit 1-on-1 dengan orang yang berhasil lolos di perusahaan targetmu: ritme kerja, 90 hari pertama, dan hal yang tidak tertulis di situs karier.','Berbayar: Plus & Intensif'],['rr','doc','Readiness Report','Rangkuman feedback dari Konsul, Role Play, dan Mentoring, plus langkah tindak lanjut.','Basic ke atas • demo']],p=PL[S.plan];
return `<div class="pg"><h2>Halo, ${E(nm())}!</h2><p>Paket aktif: <b>${p.n}</b>${p.rp?' • Role Play: '+(rpl()>1e8?'tanpa batas':Math.max(0,rpl())+' sesi tersisa'):''}${p.mt?' • Mentoring: '+Math.max(0,mtl())+' sesi tersisa':''}</p>${pfm()}${stp()}<div class="g3">${f.map(x=>`<button class="fc" onclick="go('${x[0]}')"><div class="ic">${I(x[1])}</div><h3>${x[2]}</h3><p>${x[3]}</p><span class="tag">${x[4]}</span></button>`).join('')}</div><h2 style="font-size:24px;margin-bottom:12px">Jadwal mentoringmu</h2>${S.bk.length?S.bk.map((b,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${b.d} • ${b.tm}</b><div style="font-size:14px">${b.mn.n} – ${b.mn.r} di ${b.co}</div><div class="tg">${b.tp.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div><button class="btn p" onclick="S.ss=S.bk[${i}];S.sec=0;S.att=1;go('room')">Masuk sesi</button></div><div class="em"><b>Email konfirmasi terkirim ke ${E(S.u)}</b><br>Sesi dengan ${b.mn.n} (${b.co}) sudah terjadwal. Topik: ${b.tp.join(', ')}. Siapkan 2 pertanyaan dan masuk 5 menit lebih awal.</div></div>`).join(''):`<div class="card" style="color:#666">Belum ada jadwal mentoring.</div>`}${sub()}${refc()}</div>`}
function kon(){const t=S.kt;return `<div class="pg"><h2>Gavi Konsul</h2><p>Konsul apa saja seputar kerjaan, atau cek kesenjangan profilmu untuk posisi target.</p><div class="cat"><button class="${t=='c'?'on':''}" onclick="S.kt='c';render()">Ngobrol bebas</button><button class="${t=='g'?'on':''}" onclick="S.kt='g';render()">Peta kesenjangan</button></div>${t=='c'?kch():kgp()}</div>`}
function kch(){const free=!PL[S.plan].p,n=S.ch.filter(m=>m.w=='me').length,off=free&&n>=5;return `<div class="card"><div class="chd">${gv()}Gavi Konsul</div><div class="chat" id="cb">${S.ch.map(m=>`<div class="bb ${m.w}">${E(m.t)}</div>`).join('')}${S.busy?'<div class="bb">Gavi mengetik…</div>':''}</div><div class="qk">${['Atasanku suka ubah-ubah arahan','Ditawari kerja baru, ambil nggak ya?','Gimana minta naik gaji?'].map(q=>`<button onclick="sk('${q}')">${q}</button>`).join('')}</div><div class="row"><input class="in" style="margin:0" id="ki" autofocus ${off?'disabled':''} placeholder="${off?'Batas pesan gratis habis':'Ceritakan apa yang kamu hadapi…'}" onkeydown="if(event.key=='Enter')sk()"><button class="btn p" ${off?'disabled':''} onclick="sk()">Kirim</button></div>${free?`<p style="font-size:12px;color:#888;margin-top:8px">Gratis: ${Math.max(0,5-n)} pesan tersisa. Tanpa limit di Gladi Basic.</p>`:''}</div>`}
async function sk(t){t=t||$('#ki').value.trim();if(!t||S.busy||(!PL[S.plan].p&&S.ch.filter(m=>m.w=='me').length>=5))return;S.ch.push({w:'me',t});S.busy=1;render();let r;try{r=await AI(`Kamu Gavi, konsultan karier yang hangat dan praktis untuk orang yang menyiapkan diri atau sudah bekerja. ${PF()}\nRiwayat obrolan:\n${S.ch.map(m=>(m.w=='me'?'User: ':'Gavi: ')+m.t).join('\n')}\nBalas sebagai Gavi dalam bahasa Indonesia santai, maksimal 4 kalimat, beri langkah konkret, tutup dengan satu pertanyaan. Jangan beri nasihat medis atau hukum.`)}catch(e){r=rep()}S.busy=0;S.ch.push({w:'ai',t:r});render()}
function kgp(){const p=S.prof;if(!p.saved)return `<div class="card"><b>Isi profil targetmu dulu.</b><p style="color:#555;margin:6px 0 12px;font-size:14px">Perusahaan, posisi, dan CV diisi di Home.</p><button class="btn p" onclick="go('home')">Ke Home</button></div>`;
if(S.busy)return `<div class="card">Gavi sedang menyusun petamu…</div>`;if(!S.gap)return `<div class="card"><p style="margin-bottom:12px">Target: <b>${E(p.pos)}</b> di <b>${E(p.co)}</b>.</p><button class="btn p" onclick="mg()">Buat peta kesenjangan</button></div>`;
const g=S.gap,fr=!PL[S.plan].p,nm3=['Keterampilan','Pengalaman','Pengetahuan perusahaan'];return `<div class="card"><h3>Peta kesenjangan</h3>${nm3.map((n,i)=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${n}</b><span>${g.skor[i]}%</span></div><div class="mb"><i style="width:${g.skor[i]}%"></i></div><div style="font-size:13px;color:#555;margin-top:4px">${E(g.catatan[i]||'')}</div></div>`).join('')}</div><div class="card"><h3 style="margin-bottom:8px">Rencana 30 hari</h3>${g.rencana.map((x,i)=>`<div class="${fr&&i>2?'lk2':''}" style="padding:9px 0;border-top:1px solid #eee;font-size:14px">${fr&&i>2?'Terkunci di Gladi Basic':E(x)}</div>`).join('')}</div><button class="btn o" onclick="S.gap=null;render()">Perbarui peta</button>`}
async function mg(){S.busy=1;render();let g;try{g=await AI(`Kamu Gavi. Bandingkan profil user dengan kebutuhan posisi targetnya (susun dari pengetahuan umum tentang lowongan publik posisi itu). ${PF()}\nKembalikan HANYA JSON: {"skor":[keterampilan,pengalaman,pengetahuan_perusahaan] tiga angka 0-100 yang jujur,"catatan":[tiga kalimat singkat, satu per sisi],"rencana":[enam langkah konkret untuk posisi dan perusahaan itu, diawali "Hari 1–5:", "Hari 6–10:", "Hari 11–15:", "Hari 16–20:", "Hari 21–25:", "Hari 26–30:"]}`,1);if(!g.skor||g.skor.length<3||!g.rencana)throw 0}catch(e){const w=S.prof.cv.split(/\s+/).length,q=S.prof.pos,c=S.prof.co;g={skor:[Math.min(80,30+(w/3|0)),35,35],catatan:['Perkuat skill inti posisi ini.','Tambah pengalaman lewat proyek mini.','Pelajari produk dan budaya perusahaan.'],rencana:[`Hari 1–5: pelajari 5 lowongan ${q} dan catat skill yang sering muncul`,`Hari 6–10: riset produk dan budaya ${c}`,`Hari 11–15: bikin proyek mini untuk ${q}`,'Hari 16–20: ikut pelatihan singkat atau kegiatan organisasi terkait',`Hari 21–25: latihan Role Play gaya ${c}`,`Hari 26–30: perbarui CV dan booking mentor alumni ${c}`]}}S.busy=0;S.gap=g;render()}
function rp(){if(!S.sc){if(rpl()<=0)return lock('rp');return `<div class="pg"><h2>Gavi Role Play</h2><p>Ceritakan dulu masalah atau situasi yang mau kamu latih. Gavi menyesuaikan lawan bicara dan alurnya dengan masalahmu.</p><div class="card"><label>Perusahaan tujuan</label><select id="rco" class="in"><option value="">Tidak ada</option>${COM.map(c=>`<option ${(S.rco||S.prof.co)==c?'selected':''}>${c}</option>`).join('')}</select><label>Ceritakan masalahnya</label><textarea class="ta in" id="rpb" rows="5" placeholder="Tulis bebas: siapa lawan bicaramu, apa yang bikin sulit, dan hasil yang kamu mau.">${E(S.rb)}</textarea><label class="cs"><input type="checkbox" id="rcc" ${S.cc?'checked':''}><span>Saya mengizinkan kamera dan mikrofon dipakai untuk analisis nonverbal dan gaya bicara. Datanya hanya dipakai untuk umpan balik.</span></label><p style="color:#c0392b;font-size:13px">${S.err}</p><button class="btn p" onclick="st()">Mulai role play</button><p style="font-size:13px;color:#666;margin-top:8px">Sisa sesi: ${rpl()>1e8?'tanpa batas':rpl()}</p></div></div>`}
const c=S.sc,fb=S.fbk;return `<div class="pg"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px"><h2>Role Play</h2><button class="btn o" onclick="S.sc=null;S.rb='';S.fbk=null;render()">Lagi (masalah baru)</button></div><div class="rp"><div class="card sc"><dl><dt>Gavi berperan sebagai</dt><dd>${E(c.n)}${c.r?' – '+E(c.r):''}${S.rco?' di '+S.rco:''}</dd><dt>Gaya komunikasi</dt><dd>${E(c.g)}</dd><dt>Masalahmu</dt><dd>${E(S.rb)}</dd></dl><p style="font-size:12px;color:#888;margin-top:14px">Persona perusahaan diperbarui berkala oleh tim Gladi.</p></div><div class="card"><div class="chd">${gv()}Percakapan</div><div class="chat" id="cb">${S.rc.map(m=>`<div class="bb ${m.w}">${m.w=='ai'?`<b>${E(c.n)}: </b>`:''}${E(m.t)}</div>`).join('')}${S.busy?`<div class="bb">${S.rc.length?'Mengetik…':'Gavi menyiapkan situasi…'}</div>`:''}</div><div class="row"><input class="in" style="margin:0" id="rin" autofocus ${S.done||S.busy?'disabled':''} placeholder="${S.done?'Sesi selesai':'Ketik jawabanmu…'}" onkeydown="if(event.key=='Enter')rs()"><button class="btn p" ${S.done||S.busy?'disabled':''} onclick="rs()">Kirim</button></div></div></div>${S.done?`<div class="card"><h3 style="margin-bottom:8px">Umpan balik Gavi</h3>${fb?[['Isi jawaban (struktur dan relevansi)',fb.isi],['Gaya bicara (tempo, jeda, kata pengisi)',fb.gaya],['Isyarat nonverbal (kontak mata, ekspresi, postur)',S.cc?'Analisis kamera belum aktif di demo ini. Nantinya mencakup kontak mata, ekspresi, dan postur.':'Aktifkan izin kamera untuk bagian ini (belum aktif di demo).']].map(r=>`<div style="padding:9px 0;border-top:1px solid #eee;font-size:14px"><b>${r[0]}</b><br>${E(r[1])}</div>`).join(''):'Gavi menyusun umpan balik…'}</div>`:''}</div>`}
async function st(){const b=$('#rpb').value.trim();S.rb=b;S.rco=$('#rco').value;S.cc=$('#rcc').checked;if(b.length<15){S.err='Ceritakan masalahnya agak lengkap ya, satu-dua kalimat.';render();return}S.err='';S.busy=1;S.sc={n:'…',r:'',g:''};S.rc=[];S.done=0;S.fbk=null;render();let j;try{j=await AI(`Kamu merancang simulasi role play latihan kerja yang realistis. Perusahaan tujuan: ${S.rco||'tidak ditentukan'}. ${PF()}\nMasalah yang ingin dilatih user (kata user sendiri): "${b}"\nPilih lawan bicara paling relevan dengan masalah itu (klien, rekan, atasan, pewawancara, vendor, atau lainnya), jangan otomatis atasan. Kembalikan HANYA JSON: {"nama":"nama orang Indonesia","peran":"peran singkat","gaya":"gaya komunikasi sesuai perusahaan tujuan, maksimal 8 kata","pembuka":"kalimat pembuka dalam karakter, 1-2 kalimat, menyinggung detail konkret dari masalah user"}`,1);if(!j.nama||!j.pembuka)throw 0}catch(e){j={nama:'Bu Rina',peran:'Lawan bicara',gaya:'langsung dan to the point',pembuka:'Saya sudah dengar situasinya. Coba jelaskan dari sisimu, apa persisnya yang terjadi?'}}S.sc={n:j.nama,r:j.peran||'',g:j.gaya||''};S.rc=[{w:'ai',t:j.pembuka}];S.ru++;S.busy=0;render()}
async function rs(){const i=$('#rin'),t=i.value.trim();if(!t||S.busy)return;S.rc.push({w:'me',t});const n=S.rc.filter(m=>m.w=='me').length,tr=S.rc.map(m=>(m.w=='me'?'User: ':S.sc.n+': ')+m.t).join('\n');S.busy=1;if(n>=4)S.done=1;render();
if(n>=4){try{S.fbk=await AI(`Kamu Gavi, pelatih komunikasi kerja. Transkrip role play teks. Masalah user: "${S.rb}". Lawan bicara: ${S.sc.n} (${S.sc.r}).\n${tr}\nKembalikan HANYA JSON: {"isi":"umpan balik isi jawaban (struktur dan relevansi), 2 kalimat, sebut hal konkret dari jawaban user","gaya":"umpan balik gaya bicara (tempo, jeda, kata pengisi) dari gaya tulisan user, 2 kalimat"}`,1);if(!S.fbk.isi)throw 0}catch(e){S.fbk={isi:'Poin utamamu cukup jelas. Taruh solusi di awal, baru alasannya.',gaya:'Beri jeda sebelum menjawab dan kurangi kata pengisi.'}}}
else{let r;try{r=await AI(`Kamu berperan sebagai ${S.sc.n} (${S.sc.r}${S.rco?' di '+S.rco:''}), gaya komunikasi: ${S.sc.g}. Ini simulasi latihan kerja untuk masalah user: "${S.rb}".\nTranskrip:\n${tr}\nBalas sebagai ${S.sc.n} untuk giliran berikutnya: 1-3 kalimat, tetap dalam karakter, konkret dan relevan dengan detail masalah serta jawaban terakhir user, beri tekanan atau pertanyaan realistis, jangan memberi saran atau keluar dari karakter.`)}catch(e){r=['Bisa lebih konkret? Apa angkanya atau tenggatnya?','Kalau begitu, solusi apa yang bisa kamu tawarkan sekarang?'][n-1]||'Apa risikonya?'}S.rc.push({w:'ai',t:r.replace(new RegExp('^'+S.sc.n+':\\s*'),'')})}S.busy=0;render()}
function rr(){const g=S.gap,fb=S.fbk,n3=['Keterampilan','Pengalaman','Pengetahuan perusahaan'];if(!PL[S.plan].p)return `<div class="pg"><h2>Readiness Report</h2><div class="card"><b>Readiness Report ada di Gladi Basic ke atas.</b><p style="color:#555;margin:6px 0 14px;font-size:14px">Rangkuman feedback dari Konsul, Role Play, dan Mentoring.</p><button class="btn p" onclick="go('home');setTimeout(()=>$('#lgn').scrollIntoView(),50)">Lihat langganan</button></div></div>`;
if(!g&&!fb)return `<div class="pg"><h2>Readiness Report <span class="tag">Demo</span></h2><div class="card"><b>Belum ada data.</b><p style="color:#555;margin:6px 0 14px;font-size:14px">Buat peta kesenjangan di Gavi Konsul dan selesaikan satu sesi Role Play, lalu laporanmu tersusun di sini.</p><button class="btn p" onclick="go('kon')">Mulai dari Konsul</button></div></div>`;
const lo=g?g.skor.indexOf(Math.min(...g.skor.slice(0,3))):-1,sc=g?Math.round(g.skor.slice(0,3).reduce((a,b)=>a+b,0)/3):'–',row=(h,b)=>`<div class="card"><h3 style="margin-bottom:8px">${h}</h3>${b}</div>`;
return `<div class="pg"><h2>Readiness Report <span class="tag">Demo</span></h2><p>Rangkuman feedback dari semua latihanmu. Di demo ini isinya dihitung dari aktivitasmu sejauh ini.</p><div class="card" style="background:var(--ro);border:0"><small style="font-weight:800;color:var(--pu)">SKOR KESIAPAN</small><div style="font-size:44px;font-weight:800">${sc}${g?'%':''}</div><div style="font-size:14px">${E(S.prof.pos||'')}${S.prof.co?' di '+E(S.prof.co):''}</div></div>${g?row('Dari Konsul',n3.map((n,i)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${n}</b><span>${g.skor[i]}%</span></div><div class="mb"><i style="width:${g.skor[i]}%"></i></div></div>`).join('')):''}${row('Dari Role Play',fb?`<p style="font-size:14px;margin-bottom:6px"><b>${S.ru} sesi</b> dilatih.</p><p style="font-size:14px"><b>Isi:</b> ${E(fb.isi)}</p><p style="font-size:14px;margin-top:6px"><b>Gaya bicara:</b> ${E(fb.gaya)}</p>`:'<p style="font-size:14px;color:#666">Belum ada sesi Role Play yang selesai.</p>')}${row('Dari Mentoring',S.bk.length?S.bk.map(b=>`<p style="font-size:14px">${b.d}, ${b.tm} • ${b.mn.n} (${b.co}): ${b.tp.join(', ')}</p>`).join(''):'<p style="font-size:14px;color:#666">Belum ada sesi mentoring dijadwalkan.</p>')}${row('Tindak lanjut','<ol style="font-size:14px;padding-left:18px;line-height:1.8">'+(lo>=0?`<li>Fokus ke sisi paling rendah: ${n3[lo]}.</li>`:'')+'<li>Ulangi Role Play dengan masalah baru.</li><li>Bawa catatan laporan ini ke sesi mentoring.</li></ol>')}</div>`}
function recs(){const i=COM.indexOf(S.m.co);return [0,1,2].map(k=>MN[(i+k)%4])}
function mt(){if(mtl()<=0&&S.m.s<4)return lock('mt');const m=S.m,bar=`<div class="bar">${[0,1,2,3].map(i=>`<i class="${i<=Math.max(m.s-1,0)?'on':''}"></i>`).join('')}</div>`;let b='';
if(m.s==0)b=`<h3>Ketemu alumni yang sudah lolos ke perusahaan yang kamu tuju</h3><p style="margin:8px 0 18px;color:#555">Pilih perusahaan incaranmu, ceritakan apa yang ingin kamu eksplor, lalu kami cocokkan dengan alumni perusahaan itu dan topik yang relevan. Sesi 60 menit, 1-on-1. Mentor menerima ringkasan hasil simulasimu sebelum sesi.</p><button class="btn p" onclick="S.m.s=1;render()">Book sesi mentoring</button>`;
if(m.s==1)b=`<h3>Perusahaan mana yang mau kamu eksplor?</h3><div class="gc">${COM.map(c=>`<button class="ct2 ${m.co==c?'sel':''}" onclick="S.m.co='${c}';render()">${c}</button>`).join('')}</div><h4>Ceritakan apa yang ingin kamu eksplor</h4><textarea class="ta" rows="4" oninput="S.m.st=this.value" placeholder="contoh: aku fresh graduate, penasaran budaya kerja dan proses seleksinya">${E(m.st)}</textarea><p style="color:#c0392b;font-size:13px">${S.err}</p><button class="btn p" onclick="if(!S.m.co){S.err='Pilih perusahaan dulu ya';render()}else{S.err='';S.m.s=2;render()}">Lanjut</button>`;
if(m.s==2){const ds=[1,2,3,4,5].map(i=>{const d=new Date();d.setDate(d.getDate()+i);return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})});b=`<h3>Pilih tanggal dan jam</h3><div class="qk">${ds.map(d=>`<button class="chip ${m.d==d?'sel':''}" onclick="S.m.d='${d}';render()">${d}</button>`).join('')}</div><div class="qk">${['10.00','13.00','16.00','19.30'].map(t=>`<button class="chip ${m.tm==t?'sel':''}" onclick="S.m.tm='${t}';render()">${t} WIB</button>`).join('')}</div><button class="btn p" ${m.d&&m.tm?'':'disabled'} onclick="S.m.s=3;render()">Lihat mentor</button>`}
if(m.s==3){const r=recs();b=`<h3>Alumni ${m.co} yang cocok untukmu</h3><p style="color:#555;margin:4px 0 14px;font-size:14px">Data mentor di demo ini adalah contoh.</p>${r.map((x,i)=>`<button class="mc ${m.mn===i?'sel':''}" onclick="pm(${i})"><div class="av">${ini(x.n)}</div><div><b>${x.n}</b> ${i==0?'<span class="chip" style="font-size:11px;padding:2px 8px">Direkomendasikan</span>':''}<div style="font-size:13px;color:var(--pu);font-weight:600">Alumni ${m.co} • ${x.r}</div><div style="font-size:14px;margin-top:4px">${x.b}</div>${m.mn===i?`<div style="font-size:12px;margin-top:8px;font-weight:700">Topik yang bisa dibahas (pilih):</div><div class="tg">${x.t.map(t=>`<span class="chip ${m.tp.includes(t)?'sel':''}" onclick="event.stopPropagation();tt('${t}')">${t}</span>`).join('')}</div>`:''}</div></button>`).join('')}<button class="btn p" ${m.mn!==null&&m.tp.length?'':'disabled'} onclick="bk()">Book sesi</button>`}
if(m.s==4){const b0=S.bk[S.bk.length-1];b=`<h3>Sesi kamu sudah terjadwal!</h3><p style="margin:8px 0">${b0.d}, ${b0.tm} WIB bersama ${b0.mn.n} (${b0.co}).</p><div class="em"><b>Email dikirim ke ${E(S.u)}</b><br>Topik yang akan dibahas: ${b0.tp.join(', ')}. Link sesi ada di halaman Home.</div><br><button class="btn p" onclick="go('home')">Lihat di Home</button>`}
return `<div class="pg"><h2>Mentoring Alumni</h2><p>Belajar langsung dari mereka yang sudah berhasil masuk.</p><div class="card">${m.s>0&&m.s<4?bar:''}${b}</div></div>`}
function pm(i){S.m.mn=i;const w=(S.m.st||'').toLowerCase().split(/\W+/).filter(x=>x.length>3),t=recs()[i].t,mt=t.filter(x=>w.some(y=>x.toLowerCase().includes(y)));S.m.tp=mt.length?mt:t.slice(0,2);render()}
function tt(t){const a=S.m.tp,i=a.indexOf(t);i>-1?a.splice(i,1):a.push(t);render()}
function bk(){const m=S.m;S.bk.push({co:m.co,mn:recs()[m.mn],d:m.d,tm:m.tm,tp:[...m.tp]});m.s=4;render()}
function room(){const b=S.ss;return `<div class="pg"><div class="rm"><div class="vid"><span class="tm" id="tm">00:00</span><div class="me2">${S.cam?'Kamu':'Kamera mati'}</div><div><div class="av">${ini(b.mn.n)}</div><span class="nm">${b.mn.n} • ${b.mn.r}, ${b.co}</span></div><div class="ctl"><button class="${S.mic?'':'x'}" onclick="S.mic=!S.mic;render()">${I('mic')}</button><button class="${S.cam?'':'x'}" onclick="S.cam=!S.cam;render()">${I('vid')}</button><button class="end" onclick="go('home')">Akhiri</button></div></div><div class="card side"><h4 style="margin-top:0">Ringkasan simulasi (dibagikan ke mentor)</h4><p style="font-size:13px;color:#555">${S.ru?S.ru+' sesi role play'+(S.gap?', skor kesiapan '+Math.round(S.gap.skor.slice(0,3).reduce((a,b)=>a+b,0)/3)+'%':''):'Belum ada sesi role play.'}</p><h4>Agenda sesi</h4>${b.tp.map(t=>`<label><input type="checkbox"> ${t}</label>`).join('')}<h4>Pertanyaan untuk mentor</h4><label><input type="checkbox"> Hari pertama biasanya seperti apa?</label><label><input type="checkbox"> Skill apa yang paling dicari?</label><h4>Catatan</h4><textarea placeholder="Catat hal penting…"></textarea></div></div></div>`}
function render(){$('#app').innerHTML=S.v=='land'?land():`<div class="w">${head()}${{home,kon,rp,mt,room,rr}[S.v]()}</div>`;const a=$('[autofocus]');if(a&&S.v!='land')a.focus();const c=$('#cb');if(c)c.scrollTop=c.scrollHeight}
let tk=0;setInterval(()=>{if(S.v=='room'){S.sec++;const t=$('#tm');if(t)t.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0')}},1000);
render();
</script></body></html>
